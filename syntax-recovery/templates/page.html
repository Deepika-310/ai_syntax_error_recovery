<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · Syntax Error Recovery</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-{{ page }}">
<header class="site">
  <h1>Syntax Error Recovery</h1>
  <p class="lede">Write a program in a small C-like language. The LL(1) parser reports syntax errors, and a grammar-constrained Isolation Forest ranks safe recovery candidates so parsing can continue.</p>
  <nav aria-label="Pages">
    <a href="{{ url_for('page_analyze') }}"{% if page == 'analyze' %} aria-current="page"{% endif %}>Analyze</a>
    <a href="{{ url_for('page_grammar') }}"{% if page == 'grammar' %} aria-current="page"{% endif %}>Grammar</a>
    <a href="{{ url_for('page_model') }}"{% if page == 'model' %} aria-current="page"{% endif %}>Model</a>
    <a href="{{ url_for('page_evaluation') }}"{% if page == 'evaluation' %} aria-current="page"{% endif %}>Evaluation</a>
  </nav>
</header>
<main>
{% include page ~ '.html' %}
</main>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/' ~ page ~ '.js') }}"></script>
</body>
</html>
